version: 2

models:
  - name: stg_transactions
    description: >
      Очищенный слой транзакций. Одна строка — одна транзакция из источника.
      Приводятся типы, время раскладывается на дату и час, суммы
      раскладываются по сегментам через макрос amount_bucket, собираются
      ключи клиента и транзакции, считается расстояние между клиентом
      и мерчантом. Все витрины строятся только на этой модели.
    columns:
      - name: transaction_id
        description: Суррогатный ключ транзакции, собранный из времени, мерчанта, имени и суммы.
        data_tests:
          - unique
          - not_null
      - name: transaction_time
        description: Исходное время совершения транзакции.
        data_tests:
          - not_null
      - name: transaction_date
        description: Дата транзакции без времени.
        data_tests:
          - not_null
      - name: transaction_hour
        description: Час транзакции от 0 до 23.
        data_tests:
          - not_null
      - name: day_of_week
        description: Номер дня недели, 1 — понедельник, 7 — воскресенье.
        data_tests:
          - not_null
      - name: day_name
        description: Название дня недели на английском.
        data_tests:
          - not_null
      - name: merchant_name
        description: Название мерчанта.
        data_tests:
          - not_null
      - name: category
        description: Категория транзакции, 14 значений.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - 'health_fitness'
                - 'food_dining'
                - 'home'
                - 'shopping_net'
                - 'shopping_pos'
                - 'kids_pets'
                - 'misc_net'
                - 'entertainment'
                - 'gas_transport'
                - 'grocery_net'
                - 'grocery_pos'
                - 'misc_pos'
                - 'travel'
                - 'personal_care'
      - name: amount
        description: Сумма транзакции в долларах США, приведённая к Float64.
        data_tests:
          - not_null
      - name: amount_bucket
        description: Сегмент суммы, посчитанный макросом amount_bucket.
        data_tests:
          - not_null
          - accepted_values:
              values: ['micro', 'small', 'medium', 'large', 'extra_large']
      - name: customer_id
        description: Суррогатный ключ клиента, собранный из имени, фамилии и города.
        data_tests:
          - not_null
      - name: customer_name
        description: Имя и фамилия клиента через пробел.
        data_tests:
          - not_null
      - name: first_name
        description: Имя клиента.
      - name: last_name
        description: Фамилия клиента.
      - name: gender
        description: Пол клиента.
        data_tests:
          - accepted_values:
              values: ['M', 'F']
      - name: state
        description: Код штата США, два символа.
        data_tests:
          - not_null
          - relationships:
              to: ref('states')
              field: state_code
      - name: city
        description: Город клиента.
      - name: post_code
        description: Почтовый индекс клиента.
      - name: population_city
        description: Население города клиента.
      - name: jobs
        description: Профессия клиента.
      - name: street
        description: Улица и дом из адреса клиента.
      - name: lat
        description: Широта клиента.
      - name: lon
        description: Долгота клиента.
      - name: merchant_lat
        description: Широта мерчанта.
      - name: merchant_lon
        description: Долгота мерчанта.
      - name: distance_km
        description: Расстояние между клиентом и мерчантом в километрах, формула гаверсинуса.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: is_fraud
        description: Признак фрода из источника, 1 — мошенническая транзакция.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]

macros:
  - name: amount_bucket
    description: "{{ doc('amount_bucket') }}"
    arguments:
      - name: column_name
        type: string
        description: Колонка с суммой транзакции, обычно amount.

  - name: clickhouse__day_of_week
    description: "{{ doc('dbt_date_clickhouse') }}"
    arguments:
      - name: date
        type: column
        description: Колонка с датой или временем.
      - name: isoweek
        type: boolean
        description: true — неделя считается с понедельника.

  - name: clickhouse__day_name
    description: "{{ doc('dbt_date_clickhouse') }}"
    arguments:
      - name: date
        type: column
        description: Колонка с датой или временем.
      - name: short
        type: boolean
        description: true — короткое имя дня, false — полное.
