profile: 'transactions_fraud'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  transactions_fraud:
    # staging — прослойка над источником, её незачем материализовать.
    staging:
      +materialized: view
    # Витрины читают аналитики, поэтому таблицы.
    marts:
      +materialized: table
