transactions_fraud:
  target: dev
  outputs:
    dev:
      type: clickhouse
      # ClickHouse слушает порт на хост-машине, поэтому localhost
      # подходит и для Windows, и для Linux, и для WSL.
      schema: default
      host: "{{ env_var('DBT_CH_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_CH_PORT', '8123') | int }}"
      user: "{{ env_var('DBT_CH_USER', 'default') }}"
      password: "{{ env_var('DBT_CH_PASSWORD', '') }}"
      secure: false
      send_receive_timeout: 600
      connect_timeout: 10
      threads: 4
